name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: [build-only, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install checksum-pinned GitHub CLI
        run: |
          CLI_DIR=$(mktemp -d "$RUNNER_TEMP/netix-gh.XXXXXX")
          curl --fail --silent --show-error --location \
            https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_amd64.tar.gz \
            -o "$CLI_DIR/gh.tar.gz"
          echo "e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be  $CLI_DIR/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$CLI_DIR/gh.tar.gz" -C "$CLI_DIR"
          echo "$CLI_DIR/gh_2.100.0_linux_amd64/bin" >> "$GITHUB_PATH"
      # The tag must match package.json's version so pins and code never diverge.
      - run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          test "$TAG" = "$PKG" || { echo "tag v$TAG != package version $PKG"; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
