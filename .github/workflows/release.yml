name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: [build-only, Linux, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Verify tagged build and scaffold pins
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm registry:build
          git diff --exit-code -- dist r src/tokens/tokens.ts src/tokens/theme-init-snippet.ts src/tokens/style-names.ts
          test -z "$(git ls-files --others --exclude-standard -- dist r src/tokens)"
          node scripts/check-release-scaffold.mjs "$GITHUB_REF_NAME"
      - name: Install checksum-pinned GitHub CLI
        run: |
          CLI_DIR=$(mktemp -d "$RUNNER_TEMP/netix-gh.XXXXXX")
          # The host's own gh build: the build-only pool has x86_64 and aarch64 runners.
          case "$(uname -m)" in
            x86_64) GH_ARCH=amd64 GH_SHA=e4d4bb4498e8d007abe545b6568926793ace1b6447da598294a610018cb164be ;;
            aarch64) GH_ARCH=arm64 GH_SHA=ea4e7a581a32ccad6cc7923cb1576ac5859ba4b9a16ab22eb8f8a96e78e2e961 ;;
            *) echo "no pinned gh build for $(uname -m)" >&2; exit 1 ;;
          esac
          curl --fail --silent --show-error --location \
            https://github.com/cli/cli/releases/download/v2.100.0/gh_2.100.0_linux_${GH_ARCH}.tar.gz \
            -o "$CLI_DIR/gh.tar.gz"
          echo "${GH_SHA}  $CLI_DIR/gh.tar.gz" | sha256sum --check --strict
          tar -xzf "$CLI_DIR/gh.tar.gz" -C "$CLI_DIR"
          echo "$CLI_DIR/gh_2.100.0_linux_${GH_ARCH}/bin" >> "$GITHUB_PATH"
      - run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
