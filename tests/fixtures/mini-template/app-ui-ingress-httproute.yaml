# Gateway API twin of app-ui-ingress.yaml (Gateway API migration phase 1); change both files together until the Ingress is retired.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app-ui
  namespace: frontend
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: netix-edge
      namespace: netix-gateway
      sectionName: https
  hostnames:
    - app.netixai.dev
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Frame-Options
                value: DENY
              - name: X-Xss-Protection
                value: 1; mode=block
              - name: X-Content-Type-Options
                value: nosniff
              - name: Cross-Origin-Opener-Policy
                value: same-origin
              - name: Cross-Origin-Embedder-Policy
                value: require-corp
              - name: Cross-Origin-Resource-Policy
                value: cross-origin
      backendRefs:
        - name: app-ui
          port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: app-ui
  namespace: frontend
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: app-ui
  cors:
    allowOrigins:
      - https://app.netixai.dev
    allowMethods:
      - PUT
      - GET
      - POST
      - OPTIONS
      - DELETE
      - PATCH
    allowHeaders:
      - Content-Type
      - Authorization
      - Referer
      - Origin
      - X-Requested-With
      - Accept
    allowCredentials: true
    maxAge: 480h
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: app-ui
  namespace: frontend
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: app-ui
  mergeType: StrategicMerge
  rateLimit:
    global:
      rules:
        - clientSelectors:
            - sourceCIDR:
                type: Distinct
                value: 0.0.0.0/0
          limit:
            requests: 600
            unit: Minute
